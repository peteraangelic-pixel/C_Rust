[package]
name = "hotport-spike-pyo3"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Spike: binding PyO3 + batch API z rayonem (budowane w CI)"

[lib]
name = "hotport_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"
hotport-spike-core = { path = "../core" }
